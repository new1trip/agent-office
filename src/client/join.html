<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>易包裹 AI 办公室 · Join</title>
    <link rel="icon" href="/branding/ebaoguo-logo.png" />
    <link rel="stylesheet" href="./login.css" />
      <link rel="stylesheet" href="./brand.css" />
  </head>
  <body>
    <main class="card">
      <a class="ebaoguo-brand" href="https://ebaoguo.com" target="_blank" rel="noopener noreferrer" aria-label="易包裹官网"><img src="/branding/ebaoguo-logo.png" alt="易包裹 EBAOGUO"><span>AI 办公室</span></a>
      <h1 id="title">You're invited 🎉</h1>
      <p class="sub" id="sub">Checking your invite…</p>
      <form id="form" hidden>
        <label>Your name<input id="name" type="text" maxlength="24" autocomplete="username" spellcheck="false" required /></label>
        <label>Pick a password<input id="password" type="password" minlength="8" autocomplete="new-password" required /></label>
        <label>Once more<input id="again" type="password" minlength="8" autocomplete="new-password" required /></label>
        <p class="note">At least 8 characters. It's yours alone: nobody else in the office ever sees it.</p>
        <button type="submit" id="submit">Make my account</button>
      </form>
      <p id="error" class="error" role="alert"></p>
      <a id="login" href="/login" hidden>Go to sign in →</a>
    </main>
    <script type="module" src="./join.ts"></script>
  </body>
</html>
