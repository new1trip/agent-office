<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>易包裹 AI 办公室 · Sign in</title>
    <link rel="icon" href="/branding/ebaoguo-logo.png" />
    <link rel="stylesheet" href="./login.css" />
      <link rel="stylesheet" href="./brand.css" />
  </head>
  <body>
    <main class="card">
      <a class="ebaoguo-brand" href="https://ebaoguo.com" target="_blank" rel="noopener noreferrer" aria-label="易包裹官网"><img src="/branding/ebaoguo-logo.png" alt="易包裹 EBAOGUO"><span>AI 办公室</span></a>
      <h1>Agent Office</h1>
      <p class="sub" id="sub">Knock knock. What's the password?</p>
      <form id="form">
        <label id="name-row" hidden>Your name<input id="name" type="text" maxlength="24" autocomplete="username" spellcheck="false" /></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" autofocus required /></label>
        <p id="name-note" class="note" hidden>Came in with the shared office password? Leave your name blank.</p>
        <button type="submit" id="submit">Come on in</button>
        <p id="error" class="error" role="alert"></p>
      </form>
    </main>
    <script type="module" src="./login.ts"></script>
  </body>
</html>
