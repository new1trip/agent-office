<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>易包裹 AI 办公室 · Your password</title>
    <link rel="icon" href="/branding/ebaoguo-logo.png" />
    <link rel="stylesheet" href="./login.css" />
      <link rel="stylesheet" href="./brand.css" />
  </head>
  <body>
    <main class="card">
      <a class="ebaoguo-brand" href="https://ebaoguo.com" target="_blank" rel="noopener noreferrer" aria-label="易包裹官网"><img src="/branding/ebaoguo-logo.png" alt="易包裹 EBAOGUO"><span>AI 办公室</span></a>
      <h1 id="title">Your office is ready 🎉</h1>
      <p class="sub" id="sub">Unlocking…</p>
      <section id="reveal" hidden>
        <p class="warn"><strong>Write this password down now.</strong> It is shown this one time only — the office keeps just a hash and can never display it again. Share it with teammates you invite.</p>
        <div class="secret"><code id="pw"></code><button type="button" id="copy" class="mini">Copy</button></div>
        <label class="check"><input type="checkbox" id="saved" /> I saved it somewhere safe</label>
        <button type="button" id="enter" disabled>Enter the office</button>
      </section>
      <p id="error" class="error" role="alert"></p>
      <a id="login" href="/login" hidden>Go to sign in →</a>
    </main>
    <script type="module" src="./claim.ts"></script>
  </body>
</html>
