# Independently managed site: not a Hestia-generated domain config.
server {
    listen 109.123.234.144:80;
    server_name office.ebaoguo.com;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/ebaoguo-office-acme; }
    location / { return 301 https://office.ebaoguo.com$request_uri; }
}
server {
    listen 109.123.234.144:443 ssl;
    server_name office.ebaoguo.com;
    ssl_certificate /etc/letsencrypt/live/office.ebaoguo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/office.ebaoguo.com/privkey.pem;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # WebGL/whiteboard uses workers; inline styles are generated by the UI.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: https:; connect-src 'self' wss://office.ebaoguo.com https:; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    client_max_body_size 20m;
    access_log /var/log/nginx/ebaoguo-office.access.log;
    error_log /var/log/nginx/ebaoguo-office.error.log;
    location ~ /\. { return 404; }
    location / {
        proxy_pass http://127.0.0.1:4700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
